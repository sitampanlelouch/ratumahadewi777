        content: '';

        top: -2px;
        left: -2px;
        right: -2px;

        background: linear-gradient(135deg,

        inset: 2px;
        background: #050505;
        border-radius: 28px;
        z-index: -1;
      }
      
      @keyframes fadeInUp {
